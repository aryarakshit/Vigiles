name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Foundry — reference vault, guardrails, hostile adapters, invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge build --sizes
      - run: forge test -vv

  stylus:
    name: Stylus — risk engine + TestVM tests, clippy, size-checked WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vigiles-vault
    steps:
      - uses: actions/checkout@v4
      - name: Rust nightly (build-std needs rust-src)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-src
      - name: Unit tests (pure risk engine + TestVM against the real contract)
        run: cargo test --lib
      - name: Clippy on the wasm target
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: Build WASM (panic=immediate-abort via .cargo/config.toml)
        run: cargo build --release --target wasm32-unknown-unknown
      - name: wasm-opt (same pass as the deploy script)
        run: |
          npm i -g binaryen
          wasm-opt -Oz --enable-bulk-memory-opt --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int             -o target/wasm32-unknown-unknown/release/vigiles_vault.opt.wasm target/wasm32-unknown-unknown/release/vigiles_vault.wasm
      - name: Enforce Stylus size limits (128 KiB raw, 24 KiB brotli)
        run: |
          pip install brotli --quiet
          python - <<'PY'
          import brotli, sys
          raw = open('target/wasm32-unknown-unknown/release/vigiles_vault.opt.wasm','rb').read()
          br = brotli.compress(raw, quality=11, lgwin=22)
          print(f"raw={len(raw)} brotli={len(br)}")
          assert len(raw) <= 128*1024, "uncompressed WASM over 128 KiB"
          assert len(br) <= 24*1024, "compressed WASM over 24 KiB (EIP-170)"
          PY
      - name: ABI export matches committed interface
        run: |
          cargo run --features export-abi | sed 's/^interface IAgentVault {/interface IAgentVaultStylus {/' > /tmp/abi.sol
          tail -n +7 ../contracts/src/IAgentVaultStylus.sol | diff - /tmp/abi.sol

  frontend:
    name: Next.js — typecheck + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  mcp:
    name: MCP server — typecheck + handshake
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - name: initialize + tools/list over stdio
        run: |
          (echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; \
           echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'; \
           echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 6) | timeout 40 npx tsx server.ts | grep -q vigiles_execute_trade
