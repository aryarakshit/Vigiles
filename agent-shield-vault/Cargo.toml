[package]
name = "agent-shield-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.10.9"
alloy-primitives = "=1.7.3"
alloy-sol-types = "=1.7.3"
mini-alloc = "0.4.2"

[features]
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "agent-shield-vault"
path = "src/main.rs"
required-features = ["export-abi"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
